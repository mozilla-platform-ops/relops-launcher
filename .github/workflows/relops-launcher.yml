name: Tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go tests and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.59.0'
      - name: Check formatting, vet, run race tests, and build
        run: just check build
      - run: bin/relops --version

  bundle:
    name: Site tests and preview bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.59.0'
      - name: Build site and test download behavior
        run: just site-check
      - name: Verify packaged Linux binary
        run: |
          release_version=$(cat VERSION)
          cd "dist/site/downloads/v$release_version"
          shasum -a 256 -c SHA256SUMS
          install -m 755 relops-linux-amd64 "$RUNNER_TEMP/relops"
          test "$("$RUNNER_TEMP/relops" --version)" = "relops $release_version"
      - uses: actions/upload-artifact@v7
        with:
          name: relops-site-preview-${{ github.sha }}
          path: dist/site/
          if-no-files-found: error
